<div class="help-component">

  <!-- Left Arrow -->
  <div class="nav-arrow left-arrow" data-bind="click: prevPage, enable: currentIndex() > 0">
    &#10094;
  </div>

  <!-- Main Content -->
  <div class="help-main">
    <img class="help-image"
      data-bind="attr: { src: currentPage().image, title: currentPage().title, alt: currentPage().title }" />

    <div class="help-content">
      <h3 data-bind="text: currentPage().title"></h3>
      <p data-bind="text: currentPage().text"></p>
    </div>

    <div class="progress-indicator">
      <!-- ko foreach: helpPages -->
        <div data-bind="css: { 'progress-dot': true, 'active': $index() === $parent.currentIndex() }"></div>
      <!-- /ko -->
    </div>
  </div>

  <!-- Right Arrow -->
  <div class="nav-arrow right-arrow" data-bind="click: nextPage, enable: currentIndex() < helpPages().length - 1">
    &#10095;
  </div>

</div>
