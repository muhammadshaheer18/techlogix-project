<head>
  <link rel="stylesheet" href="../../css/summaryPage.css">
</head>
<div class="success-container">
  <div class="checkmark-container">
    <div class="checkmark-icon"></div>
  </div>

  <h1 class="success-title">
    You have successfully<br />registered for online banking
  </h1>

  <p class="success-subtitle">
    Following are the details of your registered online banking account.
  </p>

  <!-- ko if: !isLoading() -->
  <!-- ko ifnot: errorMessage -->
  <div class="account-details">
    <div class="detail-item">
      <div class="detail-label">USERNAME</div>
      <div class="detail-value" data-bind="text: username"></div>
    </div>
    <div class="detail-item">
      <div class="detail-label">ACCOUNT TITLE</div>
      <div class="detail-value" data-bind="text: accountTitle"></div>
    </div>
    <div class="detail-item">
      <div class="detail-label">ACCOUNT NUMBER</div>
      <div class="detail-value" data-bind="text: accountNumber"></div>
    </div>
  </div>

  <button class="continue-btn" data-bind="click: handleContinue">
    Continue to Log In
  </button>
  <!-- /ko -->

  <!-- ko if: errorMessage -->
  <p style="color: red; font-weight: 600;" data-bind="text: errorMessage"></p>
  <!-- /ko -->
  <!-- /ko -->

  <!-- ko if: isLoading -->
  <p>Loading account details...</p>
  <!-- /ko -->
</div>
