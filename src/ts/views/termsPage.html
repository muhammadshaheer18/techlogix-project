<div class="terms-container" data-bind="with: $data">
  <div class="terms-card">
    <div class="header">
      <h1 data-bind="text: title"></h1>
    </div>

    <div class="terms-content">
      <p data-bind="text: intro"></p>

      <!-- ko foreach: sections -->
      <h6 data-bind="text: heading"></h6>
      <!-- ko foreach: paragraphs -->
      <p data-bind="text: $data, css: { important: $data.includes('Please do not access') }"></p>
      <!-- /ko -->
      <!-- /ko -->
         <label>
        <input type="checkbox" data-bind="checked: accepted" />
        I accept the Terms & Conditions
      </label>
    </div>

    <div class="button-group">
      <button type="button" class="btn btn-back" data-bind="click: handleBack">
        Back
      </button>
      <button type="button" class="btn btn-next" data-bind="click: handleAccept, enable: accepted">
        Next
      </button>
    </div>
  </div>
</div>
