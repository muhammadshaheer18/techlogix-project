<div class="login-details-container">
  <div class="login-details-card">
    <div class="header">
      <h1>Create Login Details <span>(2/3)</span></h1>
    </div>

    <form novalidate>
      <!-- Password Field -->
      <div class="form-group">
        <label for="password">
          <h6 class="sub-header">Password</h6>
        </label>
        <div class="input-container">
          <input type="password" id="password" name="password" data-bind="
              value: password, 
              attr: { type: getPasswordInputType() },
              css: getPasswordInputClass()
            " class="form-input" placeholder="••••••••••" autocomplete="new-password">
          <button type="button" class="show-hide-btn"
            data-bind="click: togglePasswordVisibility, text: getPasswordToggleText()">
          </button>
        </div>

        <div class="password-strength">
          <div class="strength-label">
            Password Strength: <span data-bind="text: passwordStrength"></span>
          </div>
          <ul class="strength-requirements">
            <li data-bind="css: getRequirementClass('minLength')">
              Password should be minimum 8 characters
            </li>
            <li data-bind="css: getRequirementClass('hasUpper')">
              One or more uppercase letters should be included
            </li>
            <li data-bind="css: getRequirementClass('hasSpecial')">
              Should contain at least one special character
            </li>
          </ul>
        </div>
      </div>
      
      <!-- Re-enter Password Field -->
      <div class="form-group">
        <label for="confirmPassword">
          <h6 class="sub-header">Re-enter Password</h6>
        </label>
        <div class="input-container">
          <input type="password" id="confirmPassword" name="confirmPassword" data-bind="
              value: confirmPassword, 
              attr: { type: getConfirmPasswordInputType() },
              css: getConfirmPasswordInputClass()
            " class="form-input" placeholder="••••••••••" autocomplete="new-password">
          <button type="button" class="show-hide-btn"
            data-bind="click: toggleConfirmPasswordVisibility, text: getConfirmPasswordToggleText()">
          </button>
        </div>
        <div class="status-message" data-bind="
            text: confirmPasswordStatus,
            css: confirmPasswordStatusClass,
            visible: confirmPasswordStatus() !== ''
          ">
        </div>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button type="button" class="btn btn-back" data-bind="click: goBack">
          Back
        </button>
        <button type="submit" class="btn btn-next" data-bind="click: goNext,enable: isNextButtonEnabled">
          Next
        </button>
      </div>
    </form>
  </div>
</div>
