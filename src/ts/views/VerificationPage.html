  <div class="verification-container">

    <div class="left-section">

      <div class="header">
        <h1>Create Login Details <span>(1/3)</span></h1>
      </div>
      <h6 class="sub-header">Username</h6>
        <div class="form-group">
          <input type="text" class="username-input" placeholder="032211234567">
          <span class="checkmark">✔</span>
          <div class="success-text">Username Available</div>
          <p class="info-text">Your default username is your mobile number</p>
        </div>

        <div class="conditions">
          <p>If you wish to change it please refer the following conditions:</p>
          <ul>
            <li>Minimum Username length should be 8 charachters with a minimum length of 16 charachters.</li>
            <li>Special Characters are optional. </li>
          </ul>
        </div>

        <div class="button-group">
          <button class="btn-back" data-bind="click: goBack">Back</button>
          <button class="btn-next" data-bind="click: goNext">Next</button>
        </div>

    </div>

  </div>
</div>
