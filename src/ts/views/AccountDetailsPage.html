<div class="oj-hybrid-padding">
  <div class="account-details-container">
    <!-- Left Section -->
    <div class="left-section">
      <div class="header">
        <h1>Enter Account Details</h1>
      </div>

      <!-- Nav-Bar component -->
      <nav-bar></nav-bar>

      <!-- Tabs -->
      <div class="tab-navigation">
        <div
          class="tab-item"
          data-bind="css: { active: activeTab() === 'account', inactive: activeTab() !== 'account' }, click: function() { switchTab('account') }"
        >
          Account Number
        </div>
        <div
          class="tab-item"
          data-bind="css: { active: activeTab() === 'iban', inactive: activeTab() !== 'iban' }, click: function() { switchTab('iban') }"
        >
          IBAN
        </div>
      </div>

      <!-- Account Number Form -->
      <div class="form-section" data-bind="if: activeTab() === 'account'">
        <div class="form-group">
          <label class="form-label">Account Number</label>
          <input
            type="text"
            class="form-input"
            placeholder="XXXXX XXXXXXXXX"
            data-bind="textInput: accountNumber, event: { focus: onInputFocus }"
          />
          <div class="help-text">Please enter your 14 digit Account Number</div>
        </div>

        <div class="button-group">
          <button class="btn-back" data-bind="click: goBack">Back</button>
          <button class="btn-next" data-bind="click: goNext">Next</button>
        </div>
      </div>

      <!-- IBAN Form -->
      <div class="form-section" data-bind="if: activeTab() === 'iban'">
        <div class="form-group">
          <label class="form-label">IBAN</label>
          <input
            type="text"
            class="form-input"
            placeholder="XXXX XXXX XXXX XXXX"
            data-bind="textInput: ibanNumber, event: { focus: onInputFocus }"
          />
          <div class="help-text">Please enter your IBAN number</div>
        </div>

        <div class="button-group">
          <button class="btn-back" data-bind="click: goBack">Back</button>
          <button class="btn-next" data-bind="click: goNext">Next</button>
        </div>
      </div>
    </div>

    <!-- Help Section Component -->
    <div class="right-section">
      <help-card></help-card>
    </div>
  </div>
</div>

<style>
  .account-details-container {
    display: flex;
    flex-direction: row;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      sans-serif;
  }
  .button-group{
    margin-top: 96px;
  }

  .left-section {
    width: 700px;
  }
  .right-section{
    margin-right:30px;
  }

  .tab-navigation {
    display: flex;
    flex-direction: row;
    margin-bottom: 20px;
    width: 90%;
  }

  .tab-item {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    width: 100%;
    height: 48px;
    border-radius: 4px;
    transition: all 0.2s ease;
    font-size: 18px;
    font-weight: 600;
    color: #ccc;
  }

  .tab-item.active {
    background-color: #ffecfd;
    border-bottom-color: #7a147a;
    color: #7a147a;
  }

  .tab-item.inactive {
    background-color: #ebe8e8;
    color: #999;
  }

  .form-label {
    font-size: 17px;
    margin-top: 80px;
  }

  .form-input{
    width: 100%;
    height: 55px;
  }
  .form-input:focus{
    border: 1px solid white;
  }
</style>
