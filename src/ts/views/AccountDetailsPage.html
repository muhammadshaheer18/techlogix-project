<div class="oj-hybrid-padding">
  <div class="account-details-container">

    <!-- Left Section -->
    <div class="left-section">
      <div class="header">
        <h1>Enter Account Details</h1>
      </div>

      <nav-bar></nav-bar>

      <!-- Tabs -->
      <div class="tab-navigation">
        <div class="tab-item"
          data-bind="css: { active: activeTab() === 'account', inactive: activeTab() !== 'account' }, click: function() { switchTab('account') }">
          Account Number
        </div>
        <div class="tab-item"
          data-bind="css: { active: activeTab() === 'iban', inactive: activeTab() !== 'iban' }, click: function() { switchTab('iban') }">
          IBAN
        </div>
      </div>

      <!-- Account Number Form -->
      <div class="form-section" data-bind="if: activeTab() === 'account'">
        <div class="form-group">
          <label class="form-label">Account Number</label>
          <input type="text" class="form-input" placeholder="XXXXX XXXXXXXXX"
            data-bind="textInput: accountNumber, event: { focus: onInputFocus }" />
          <div class="help-text">Please enter your 14 digit Account Number</div>
        </div>

        <div class="button-group">
          <button class="btn-back" data-bind="click: goBack">Back</button>
          <button class="btn-next" data-bind="click: goNext">Next</button>
        </div>
      </div>

      <!-- IBAN Form -->
      <div class="form-section" data-bind="if: activeTab() === 'iban'">
        <div class="form-group">
          <label class="form-label">IBAN</label>
          <input type="text" class="form-input" placeholder="XXXX XXXX XXXX XXXX"
            data-bind="textInput: ibanNumber, event: { focus: onInputFocus }" />
          <div class="help-text">Please enter your IBAN number</div>
        </div>

        <div class="button-group">
          <button class="btn-back" data-bind="click: goBack">Back</button>
          <button class="btn-next" data-bind="click: goNext">Next</button>
        </div>
      </div>
    </div>

    <!-- Help Section -->
    <div class="help-section">
      <img class="cheque-image" src="/css/images/Icons/cheque.png" alt="Cheque" />
      <div class="help-content">
        <h3>How to find your Account Number?</h3>
        <p>The simplest way of finding your Account Number is to look for it on your cheque book.</p>
      </div>

      <div class="progress-indicator">
        <div class="progress-dot active"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
      </div>
    </div>

  </div>
</div>

<style>
  .account-details-container {
    display: flex;
    flex-direction: row;
    gap: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .left-section {
    width: 700px;
  }

  .tab-navigation {
    display: flex;
    flex-direction: row;
    margin-bottom: 20px;
  }

  .tab-item {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    width: 100%;
    height: 60px;
    border-radius: 4px;
    transition: all 0.2s ease;
    font-size: 18px;
    font-weight: 600;
    color: #ccc;
  }

  .tab-item.active {
    background-color: #ffecfd;
    border-bottom-color: #7a147a;
    color: #7a147a;
  }

  .tab-item.inactive {
    background-color: #ccc;
    color: #333;
  }

  .form-label {
    font-size: 17px;
  }
</style>
