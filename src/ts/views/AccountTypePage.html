<div class="oj-hybrid-padding">
  <div class="account-details-container" style="display:flex; gap:2rem;">

    <!-- Left Section - Form -->
    <div class="left-section" style="flex:1;">
      
      <!-- Header -->
      <div class="header">
        <h1>Enter Account Details</h1>
      </div>

      <!-- Tab Navigation -->
      <div class="tab-navigation" style="display:flex; gap:1rem; margin-bottom:1rem;">
        <div class="tab-item" 
             data-bind="css: { active: activeTab() === 'account', inactive: activeTab() !== 'account' }, 
                        click: function() { switchTab('account') }">
          Account Number
        </div>
        <div class="tab-item" 
             data-bind="css: { active: activeTab() === 'iban', inactive: activeTab() !== 'iban' }, 
                        click: function() { switchTab('iban') }">
          IBAN
        </div>
      </div>

      <!-- Account Number Form -->
      <div class="form-section" data-bind="if: activeTab() === 'account'">
        <div class="form-group">
          <label class="form-label">Account Number</label>
          <input type="text" class="form-input" placeholder="XXXXX XXXXXXXXX"
                 data-bind="textInput: accountNumber, event: { focus: onInputFocus }" />
          <div class="help-text">Please enter your 14 digit Account Number</div>
        </div>

        <div class="button-group">
          <button class="btn-back" data-bind="click: goBack">Back</button>
          <button class="btn-next" data-bind="click: goNext">Next</button>
        </div>
      </div>

      <!-- IBAN Form -->
      <div class="form-section" data-bind="if: activeTab() === 'iban'">
        <div class="form-group">
          <label class="form-label">IBAN</label>
          <input type="text" class="form-input" placeholder="XXXX XXXX XXXX XXXX"
                 data-bind="textInput: ibanNumber, event: { focus: onInputFocus }" />
          <div class="help-text">Please enter your IBAN number</div>
        </div>

        <div class="button-group">
          <button class="btn-back" data-bind="click: goBack">Back</button>
          <button class="btn-next" data-bind="click: goNext">Next</button>
        </div>
      </div>
    </div>

    <!-- Right Section - Help -->
    <div class="help-section" style="width:300px; flex-shrink:0;">
      <img class="cheque-image" src="/src/css/images/Icons/cheque.png" title="Cheque" alt="Cheque"
           style="max-width:300px; width:100%; height:auto;" />

      <div class="help-content" style="margin-top:1rem;">
        <h3>How to find your Account Number?</h3>
        <p>The simplest way of finding your Account Number is to look for it on your cheque book.</p>
      </div>

      <div class="progress-indicator" style="display:flex; gap:0.5rem; margin-top:1rem;">
        <div class="progress-dot active"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
      </div>
    </div>

  </div>
</div>
