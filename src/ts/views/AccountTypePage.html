<head>
  <link rel="stylesheet" href="../../css/AccountTypePage.css" type="text/css" />
</head>

<body>
  <div class="oj-hybrid-padding">
    <div class="account-type-container">
      <!-- Left Section -->
      <div class="left-section">
        <div class="header">
          <h1>Select Account Type</h1>
        </div>

        <!-- Tabs -->
        <div class="account-type-tabs">
          <div class="tabs-container" data-bind="foreach: accountTypes">
            <div class="tab-item"
              data-bind="click: $parent.selectAccountType, css: { 'active': $parent.selectedAccountType() === $data, 'inactive': $parent.selectedAccountType() !== $data }">
              <div class="tab-icon"> <!-- ko if: $data === 'Individual' --> <svg class="icon-svg" viewBox="0 0 24 24">
                  <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                    fill="currentColor" />
                </svg> <!-- /ko --> <!-- ko if: $data === 'Sole Proprietor' --> <svg class="icon-svg"
                  viewBox="0 0 24 24">
                  <path
                    d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
                    fill="currentColor" />
                </svg> <!-- /ko --> <!-- ko if: $data === 'Credit Card' --> <svg class="icon-svg" viewBox="0 0 24 24">
                  <path
                    d="M20 4H4c-1.1 0-2 .9-2 2v3h20V6c0-1.1-.9-2-2-2zm0 5H2v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-9zm-3 7H5v-2h12v2z"
                    fill="currentColor" />
                </svg> <!-- /ko --> <!-- ko if: $data === 'Smart Wallet' --> <svg class="icon-svg" viewBox="0 0 24 24">
                  <path
                    d="M21 7H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm0 10H3v-8h18v8zm-3-4H6v2h12v-2z"
                    fill="currentColor" />
                </svg> <!-- /ko --> <!-- ko if: $data === 'Foreign National' --> <svg class="icon-svg"
                  viewBox="0 0 24 24">
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-2.83-.48-5-2.94-5-5.93 0-.62.1-1.21.27-1.77l7.46 7.46c-.56.17-1.15.27-1.73.24zM17.73 13.2l-7.46-7.46c.56-.17 1.15-.27 1.73-.24 2.83.48 5 2.94 5 5.93 0 .62-.1 1.21-.27 1.77z"
                    fill="currentColor" />
                </svg> <!-- /ko --> </div>
              <div class="tab-label" data-bind="text: $data"></div>
            </div>
          </div>
        </div>
        <!-- CNIC Input -->
        <div class="form-section">
          <div class="form-group">
            <label class="form-label">CNIC Number</label>
            <input type="text" class="cnic-input" placeholder="XXXXX-XXXXXXX-X" maxlength="15"
              data-bind="textInput: cnicNumber, event: { focus: onCnicFocus }" />
            <div class="help-text">Please enter your 13-digit CNIC Number</div>
            <div class="error-message" data-bind="visible: cnicError, text: cnicError"></div>
          </div>

          <div class="selected-type-display">
            <strong>Selected Account Type:</strong>
            <span class="selected-type" data-bind="text: selectedAccountType"></span>
          </div>

          <div class="button-group">
            <button class="btn-back" data-bind="click: goBack, enable: !isLoading()">Back</button>
            <button class="btn-next"
              data-bind="click: goNext, enable: isFormValid(), css: { 'btn-loading': isLoading() }">
              <span data-bind="if: !isLoading()">Next</span>
              <span data-bind="if: isLoading()">Processing...</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Right Section -->
      <div class="right-section">
        <help-card></help-card>
      </div>
    </div>
  </div>

</body>
