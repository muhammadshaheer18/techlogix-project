<div class="oj-hybrid-padding">
  <div class="account-details-container">

    <!-- Left Section - Form -->
    <div class="left-section">

      <!-- Header -->
      <div class="header">
        <h1>Select Account Type</h1>
      </div>

      <!-- Tab Navigation -->
      <div class="tab-navigation">
        <div class="tab-item-p1 active">
          <img src="css/images/Icons/Individual-Icon-Filled.svg" alt="">
          Individual
        </div>
        <div class="tab-item-p1">
          <img src="" alt="">
          Sole Propertier
        </div>
        <div class="tab-item-p1">
          <img src="" alt="">
          Credit Card
        </div>
        <div class="tab-item-p1">
          <img src="" alt="">
          Smart Wallet
        </div>
        <div class="tab-item-p1">
          <img src="/css/images/Icons/Foreign-National-Icon-Unfilled.svg" alt="">
          Foreign National
        </div>
      </div>

      <!-- Account Number Form -->
      <div class="form-section">
        <div class="form-group">
          <label class="form-label">CNIC Number</label>
          <input type="text" class="form-input" placeholder="XXXXX XXXXXXX X">
          <div class="help-text">Please enter your 13-digit CNIC Number</div>
        </div>

        <div class="button-group">
          <button class="btn-back" data-bind="click: goBack">Back</button>
          <button class="btn-next" data-bind="click: goNext">Next</button>
        </div>
      </div>

      <!-- IBAN Form -->

    </div>

    <!-- Right Section - Help -->
    <div class="help-section">
      <img class="cheque-image" src="/css/images/Icons/nic.svg" title="Cheque" alt="Cheque" />

      <div class="help-content">
        <h3>Find your CNIC Identity Number</h3>
        <p>Permenant Citizens of Pakistan can find their CNIC Identity number on their Identity Card issued by NADRA</p>
      </div>

      <div class="progress-indicator">
        <div class="progress-dot active"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
      </div>
    </div>

  </div>
</div>
