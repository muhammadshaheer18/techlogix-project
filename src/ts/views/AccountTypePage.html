<div class="oj-hybrid-padding">
  <div class="account-type-container">

    <!-- Left Section - Form -->
    <div class="left-section">

      <!-- Header -->
      <div class="header">
        <h1>Select Account Type</h1>
      </div>

      <!-- Account Type Selection Tabs -->
      <div class="account-type-tabs">
        <div class="tabs-container" data-bind="foreach: accountTypes">
          <div class="tab-item" 
               data-bind="click: $parent.selectAccountType,
                         css: { 
                           'active': $parent.selectedAccountType() === $data,
                           'inactive': $parent.selectedAccountType() !== $data 
                         }">
            <div class="tab-icon">
              <!-- ko if: $data === 'Individual' -->👤<!-- /ko -->
              <!-- ko if: $data === 'Sole Proprietor' -->👥<!-- /ko -->
              <!-- ko if: $data === 'Credit Card' -->💳<!-- /ko -->
              <!-- ko if: $data === 'Smart Wallet' -->💼<!-- /ko -->
              <!-- ko if: $data === 'Foreign National' -->🌐<!-- /ko -->
            </div>
            <div class="tab-label" data-bind="text: $data"></div>
          </div>
        </div>
      </div>

      <!-- CNIC Form Section -->
      <div class="form-section">
        <div class="form-group">
          <label class="form-label">CNIC Number</label>
          <input type="text" 
                 class="cnic-input" 
                 placeholder="XXXXX-XXXXXXX-X"
                 maxlength="15"
                 data-bind="textInput: cnicNumber, 
                           event: { focus: onCnicFocus }" />
          <div class="help-text">Please enter your 13-digit CNIC Number</div>
          
          <!-- Error Message -->
          <div class="error-message" data-bind="visible: cnicError, text: cnicError"></div>
        </div>

        <div class="selected-type-display">
          <strong>Selected Account Type:</strong> 
          <span class="selected-type" data-bind="text: selectedAccountType"></span>
        </div>

        <div class="button-group">
          <button class="btn-back" 
                  data-bind="click: goBack, enable: !isLoading()">
            Back
          </button>
          <button class="btn-next" 
                  data-bind="click: goNext, 
                            enable: isFormValid(),
                            css: { 'btn-loading': isLoading() }">
            <span data-bind="if: !isLoading()">Next</span>
            <span data-bind="if: isLoading()">Processing...</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Right Section - Help Card -->
   <div class="help-section">
      <img class="cheque-image" src="/css/images/Icons/nic.svg" title="Cheque" alt="Cheque" />

      <div class="help-content">
        <h3>Find your CNIC Identity Number.</h3>
        <p>Permenant Citizens of Pakistan can find their CNIC Identity number on their Identity card issues by NADRA</p>
      </div>

      <div class="progress-indicator">
        <div class="progress-dot active"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
      </div>
    </div>

  </div>
</div>
